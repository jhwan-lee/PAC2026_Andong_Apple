# PAC 2026 안동청과 미션 - 사과 외관 품질 선별 YOLO 데이터셋 정의 파일
# ==============================================================================
# 경로 설정: 상대 경로 또는 절대 경로 사용 가능
path: ./apple_dataset # 데이터셋 루트 디렉터리
train: images/train   # 학습 이미지 경로 (path 기준 상대 경로)
val: images/val       # 검증 이미지 경로
test: images/test     # 테스트 이미지 경로 (선택 사항)

# 클래스 정의
# 0: grade_high (상 등급: 밝은 붉은색, 균일한 착색, 고품질)
# 1: grade_mid  (중 등급: 어두운 갈적색 또는 착색 불균일)
# 2: defect     (결점/리젝트: 멍, 흠집, 썩음, 기형)
names:
  0: grade_high
  1: grade_mid
  2: defect
